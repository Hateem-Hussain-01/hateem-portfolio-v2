<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p4-t">
  <title id="p4-t">Zero-Day IDS: Intrusion detection for zero-day attacks, built with machine learning.</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/><stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="p4-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#8C6D1F" stop-opacity=".7"/><stop offset="1" stop-color="#3A2A05" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p4-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#D4A017" stroke-opacity=".07"/>
    </pattern>
    <filter id="p4-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p4-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p4-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E1"/><stop offset=".45" stop-color="#F0D060"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p4-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p4-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p4-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p4-in { animation: p4-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p4-d1 { animation-delay: .15s; } .p4-d2 { animation-delay: .4s; }
    .p4-chip { animation: p4-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p4-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p4-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p4-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p4-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p4-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-in, .p4-chip { animation: none; } .p4-draw { animation: none; stroke-dashoffset: 0; } }
    .p4-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p4-trace 7s linear infinite; }
    @keyframes p4-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p4-trace { display: none; } }
  </style>
  <g clip-path="url(#p4-clip)">
    <rect width="1200" height="370" fill="url(#p4-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p4-grid)"/>
    <rect width="1200" height="370" fill="url(#p4-glow)"/>
    <g class="p4-in p4-d1">
      <text class="p4-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#D4A017">04 · IDS · MACHINE LEARNING · 2026</text>
      <text class="p4-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#FFF8E1">Zero-Day IDS</text>
      <text class="p4-sans" x="56" y="166" font-size="17" fill="#A8A08A">Intrusion detection for zero-day attacks, built with machine learning.</text>
      <text class="p4-mono" x="56" y="200" font-size="12.5" fill="#F0D060"><tspan fill="#D4A017">BUILT ›</tspan> notebook-based ML pipeline for intrusion detection</text>
      <line class="p4-draw" x1="56" y1="226" x2="680" y2="226" stroke="#D4A017" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#FFF8E1">98.56%</text><text class="p4-sans" y="24" font-size="12.5" fill="#A8A08A">flower CNN paper — train</text></g>
    <g transform="translate(261 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#FFF8E1">99.39%</text><text class="p4-sans" y="24" font-size="12.5" fill="#A8A08A">flower CNN paper — validation</text></g>
    <g transform="translate(466 266)"><text class="p4-serif" font-size="34" font-weight="300" fill="#FFF8E1">Jupyter</text><text class="p4-sans" y="24" font-size="12.5" fill="#A8A08A">Notebook · Zero_Day_Attact</text></g>
      <g class="p4-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="62" height="26" rx="13" fill="#1A1405" stroke="#D4A017" stroke-opacity=".35"/><text class="p4-mono" x="87" y="331" text-anchor="middle" font-size="11.5" fill="#F0D060">Python</text></g><g class="p4-chip" style="animation-delay:1.12s"><rect x="126" y="314" width="132" height="26" rx="13" fill="#1A1405" stroke="#D4A017" stroke-opacity=".35"/><text class="p4-mono" x="192" y="331" text-anchor="middle" font-size="11.5" fill="#F0D060">TensorFlow/Keras</text></g><g class="p4-chip" style="animation-delay:1.24s"><rect x="266" y="314" width="104" height="26" rx="13" fill="#1A1405" stroke="#D4A017" stroke-opacity=".35"/><text class="p4-mono" x="318" y="331" text-anchor="middle" font-size="11.5" fill="#F0D060">Scikit-Learn</text></g><g class="p4-chip" style="animation-delay:1.36s"><rect x="378" y="314" width="69" height="26" rx="13" fill="#1A1405" stroke="#D4A017" stroke-opacity=".35"/><text class="p4-mono" x="412" y="331" text-anchor="middle" font-size="11.5" fill="#F0D060">Jupyter</text></g>
    </g>
    <g class="p4-in p4-d2"><g transform="translate(0 35)">
      <g transform="translate(860 30)">
        <g transform="translate(0 200)">
          <animateTransform attributeName="transform" type="translate" values="0 200; 0 200; 0 200" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#3A2A05" fill-opacity=".92" stroke="#F0D060" stroke-opacity=".7" stroke-dasharray="5 4"/>
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#FFF8E1" transform="skewX(-38) translate(14 0)">network traffic</text>
        </g>
        <g transform="translate(0 158)">
          <animateTransform attributeName="transform" type="translate" values="0 158; 0 152; 0 158" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#1A1405" fill-opacity=".92" stroke="#D4A017" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#FFF8E1" transform="skewX(-38) translate(14 0)">TensorFlow/Keras</text>
        </g>
        <g transform="translate(0 116)">
          <animateTransform attributeName="transform" type="translate" values="0 116; 0 104; 0 116" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#1A1405" fill-opacity=".92" stroke="#D4A017" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#FFF8E1" transform="skewX(-38) translate(14 0)">Scikit-Learn</text>
        </g>
        <g transform="translate(0 74)">
          <animateTransform attributeName="transform" type="translate" values="0 74; 0 56; 0 74" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
          <path d="M0 0 L120 -46 L280 -46 L160 0 Z" fill="#1A1405" fill-opacity=".92" stroke="#D4A017" stroke-opacity=".45" />
          <text class="p4-mono" x="96" y="-17" font-size="10.5" fill="#FFF8E1" transform="skewX(-38) translate(14 0)">zero-day alert</text>
        </g>
      </g>
      <text class="p4-mono" x="1176" y="270" text-anchor="end" font-size="10.5" letter-spacing="1.5" fill="#A8A08A">ZERO-DAY IDS · JUPYTER NOTEBOOK · ML</text>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#D4A017" stroke-opacity=".2"/>
    <rect class="p4-trace" style="animation-delay:-5.1s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p4-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
