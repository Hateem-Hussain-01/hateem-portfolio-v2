<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">SafeSubmit — A secure submission and assignment handling project from Muhammad Hateem Hussain's B.Sc. Software Engineering portfolio.</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/><stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <radialGradient id="p3-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#8C6D1F" stop-opacity=".7"/><stop offset="1" stop-color="#3A2A05" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#D4A017" stroke-opacity=".07"/>
    </pattern>
    <filter id="p3-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p3-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E1"/><stop offset=".45" stop-color="#F0D060"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p3-in { animation: p3-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p3-d1 { animation-delay: .15s; } .p3-d2 { animation-delay: .4s; }
    .p3-chip { animation: p3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p3-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p3-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p3-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p3-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-in, .p3-chip { animation: none; } .p3-draw { animation: none; stroke-dashoffset: 0; } }
    .p3-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p3-trace 7s linear infinite; }
    @keyframes p3-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-trace { display: none; } }
  </style>
  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    <g class="p3-in p3-d1">
      <text class="p3-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#D4A017">03 · B.SC. SOFTWARE ENGINEERING · PROJECT PORTFOLIO</text>
      <text class="p3-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#FFF8E1">SafeSubmit<tspan class="p3-serif" font-size="22" font-style="italic" fill="#F0D060" dx="14">Secure Submissions</tspan></text>
      <text class="p3-sans" x="56" y="166" font-size="17" fill="#A8A08A">A secure submission project for handling assignments safely.</text>
      <text class="p3-mono" x="56" y="200" font-size="12.5" fill="#F0D060"><tspan fill="#D4A017">BUILT ›</tspan> part of his B.Sc. Software Engineering work: secure submission handling</text>
      <line class="p3-draw" x1="56" y1="226" x2="680" y2="226" stroke="#D4A017" stroke-opacity=".3"/>
    <g transform="translate(56 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#FFF8E1">Secure</text><text class="p3-sans" y="24" font-size="12.5" fill="#A8A08A">submission handling</text></g>
    <g transform="translate(261 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#FFF8E1">B.Sc.</text><text class="p3-sans" y="24" font-size="12.5" fill="#A8A08A">Software Engineering</text></g>
    <g transform="translate(466 266)"><text class="p3-serif" font-size="34" font-weight="300" fill="#FFF8E1">safesubmit</text><text class="p3-sans" y="24" font-size="12.5" fill="#A8A08A">GitHub · Hateem-Hussain-01</text></g>
      <g class="p3-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="77" height="26" rx="13" fill="#1A1405" stroke="#D4A017" stroke-opacity=".35"/><text class="p3-mono" x="95" y="331" text-anchor="middle" font-size="11.5" fill="#F0D060">Python</text></g><g class="p3-chip" style="animation-delay:1.12s"><rect x="141" y="314" width="92" height="26" rx="13" fill="#1A1405" stroke="#D4A017" stroke-opacity=".35"/><text class="p3-mono" x="187" y="331" text-anchor="middle" font-size="11.5" fill="#F0D060">Django</text></g><g class="p3-chip" style="animation-delay:1.24s"><rect x="241" y="314" width="92" height="26" rx="13" fill="#1A1405" stroke="#D4A017" stroke-opacity=".35"/><text class="p3-mono" x="287" y="331" text-anchor="middle" font-size="11.5" fill="#F0D060">PostgreSQL</text></g>
    </g>
    <g class="p3-in p3-d2"><g transform="translate(0 35)">
      <g>
        <rect x="760" y="50" width="250" height="38" rx="12" fill="#FFF8E1" fill-opacity=".07" stroke="#D4A017" stroke-opacity=".3"/>
        <text class="p3-mono" x="776" y="74" font-size="12" fill="#FFF8E1">“submit assignment securely”</text>
        <g transform="translate(760 112)">
          <rect width="76" height="58" rx="9" fill="#1A1405" stroke="#D4A017" stroke-opacity=".3">
            <animate attributeName="fill" values="#1A1405;#8C6D1F;#1A1405;#1A1405" keyTimes="0;.08;.2;1" dur="6s" begin="1.0s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="1.0s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#A8A08A">01</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#FFF8E1">Submit</text>
        </g>
        <g transform="translate(844 112)">
          <rect width="76" height="58" rx="9" fill="#1A1405" stroke="#D4A017" stroke-opacity=".3">
            <animate attributeName="fill" values="#1A1405;#8C6D1F;#1A1405;#1A1405" keyTimes="0;.08;.2;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#A8A08A">02</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#FFF8E1">Validate</text>
        </g>
        <g transform="translate(928 112)">
          <rect width="76" height="58" rx="9" fill="#1A1405" stroke="#D4A017" stroke-opacity=".3">
            <animate attributeName="fill" values="#1A1405;#8C6D1F;#1A1405;#1A1405" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="2.2s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#A8A08A">03</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#FFF8E1">Store</text>
        </g>
        <g transform="translate(1012 112)">
          <rect width="76" height="58" rx="9" fill="#1A1405" stroke="#D4A017" stroke-opacity=".3">
            <animate attributeName="fill" values="#1A1405;#8C6D1F;#1A1405;#1A1405" keyTimes="0;.08;.2;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#A8A08A">04</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#FFF8E1">Track</text>
        </g>
        <g transform="translate(1096 112)">
          <rect width="76" height="58" rx="9" fill="#1A1405" stroke="#D4A017" stroke-opacity=".3">
            <animate attributeName="fill" values="#1A1405;#8C6D1F;#1A1405;#1A1405" keyTimes="0;.08;.2;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
            <animate attributeName="stroke-opacity" values=".3;1;.3;.3" keyTimes="0;.08;.2;1" dur="6s" begin="3.4s" repeatCount="indefinite"/>
          </rect>
          <text class="p3-mono" x="8" y="18" font-size="9" fill="#A8A08A">05</text>
          <text class="p3-mono" x="38" y="40" font-size="9.5" text-anchor="middle" fill="#FFF8E1">Confirm</text>
        </g>
        <text class="p3-mono" x="1176" y="214" font-size="12" text-anchor="end" fill="#F0D060">safesubmit → secure submissions</text>
        <text class="p3-mono" x="1176" y="240" font-size="10.5" text-anchor="end" letter-spacing="1.5" fill="#A8A08A">PYTHON · DJANGO · POSTGRESQL</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#D4A017" stroke-opacity=".2"/>
    <rect class="p3-trace" style="animation-delay:-3.4s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p3-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
